<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | Repositorio de Ingeniería Total</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff; --text: #050505; --muted: #737373;
            --accent: #0022ff; --border: #ececec; --sidebar: #f7f7f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Inter', sans-serif; line-height: 1.8;
            display: flex; height: 100vh; overflow: hidden;
        }

        /* --- SIDEBAR DE ALTA DENSIDAD --- */
        aside {
            width: 400px; background: var(--sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 40px 20px; overflow-y: auto;
        }
        aside::-webkit-scrollbar { width: 4px; }
        aside::-webkit-scrollbar-thumb { background: #000; }

        .brand { font-family: 'JetBrains Mono'; font-weight: 800; font-size: 1.1rem; margin-bottom: 40px; border-left: 6px solid var(--text); padding-left: 15px; }
        .nav-label { font-size: 0.6rem; text-transform: uppercase; color: var(--muted); letter-spacing: 2.5px; margin: 25px 0 10px; font-weight: 800; }
        .nav-item { 
            display: block; padding: 6px 0; color: var(--text); text-decoration: none; 
            font-size: 0.85rem; transition: 0.15s; border-bottom: 1px solid transparent;
        }
        .nav-item:hover { color: var(--accent); padding-left: 8px; }
        .nav-item.active { font-weight: 800; border-bottom-color: var(--text); }

        /* --- VIEWPORT DE LECTURA --- */
        main { flex: 1; overflow-y: auto; padding: 80px 10%; scroll-behavior: smooth; }
        .article { max-width: 880px; margin: 0 auto; animation: fadeUp 0.7s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .kicker { font-family: 'JetBrains Mono'; font-size: 0.7rem; color: var(--accent); font-weight: 600; margin-bottom: 1rem; }
        h1 { font-size: 3.8rem; font-weight: 800; letter-spacing: -3px; line-height: 1; margin-bottom: 2.5rem; }
        h2 { font-size: 1.8rem; font-weight: 700; margin: 4.5rem 0 1.5rem; letter-spacing: -1px; }
        p { font-size: 1.2rem; margin-bottom: 2.2rem; color: #222; font-weight: 300; text-align: justify; }

        /* --- DATA TABLES & BLOCKS --- */
        .tech-card { border: 1px solid var(--border); padding: 30px; margin: 3.5rem 0; background: #fafafa; position: relative; }
        .tech-card::before { content: "DATA_NODE"; position: absolute; top: -10px; right: 20px; background: #000; color: #fff; font-family: 'JetBrains Mono'; font-size: 0.6rem; padding: 2px 8px; }
        
        /* --- FORO PRO --- */
        .forum-wrap { background: #000; color: #fff; padding: 60px; margin-top: 10rem; border-radius: 2px; }
        .forum-wrap h3 { font-size: 2rem; margin-bottom: 1rem; letter-spacing: -1px; }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 2rem; }
        .grid-form input, .grid-form textarea { background: #111; border: 1px solid #333; color: #fff; padding: 18px; font-family: 'Inter'; font-size: 1rem; }
        .grid-form textarea { grid-column: span 2; height: 180px; }
        .btn-supreme { grid-column: span 2; padding: 20px; background: #fff; color: #000; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-supreme:hover { background: var(--accent); color: #fff; }

        @media (max-width: 1000px) { body { flex-direction: column; } aside { width: 100%; height: 40vh; } }
    </style>
</head>
<body>

    <aside id="nav-target">
        <div class="brand">NEXUS_SYSTEM_v23</div>
        </aside>

    <main>
        <div id="content-view" class="article"></div>
    </main>

    <script>
        const library = {
            'fusion_energy': {
                label: "Energía Estelar",
                cat: "Fusión Nuclear Controlada",
                title: "Confinamiento Magnético en Tokamaks de Nueva Generación",
                body: `
                    <p>La búsqueda de la energía infinita reside en la capacidad de replicar las condiciones del núcleo solar en la Tierra. A diferencia de la fisión actual, la fusión nuclear por confinamiento magnético utiliza isótopos de hidrógeno (Deuterio y Tritio) para generar helio y una cantidad masiva de energía libre de carbono.</p>
                    
                    <h2>1.1 Estabilidad Magnetohidrodinámica (MHD)</h2>
                    <p>El principal desafío de los reactores tipo Tokamak es mantener el plasma a 150 millones de grados Celsius sin que toque las paredes de la cámara de vacío. Esto se logra mediante imanes superconductores de alta temperatura (HTS) que generan campos de hasta 20 Teslas. Cualquier inestabilidad en el flujo de plasma puede causar una "disrupción", liberando una energía térmica capaz de vaporizar el recubrimiento de wolframio del reactor.</p>

                    <div class="tech-card">
                        <p><strong>Factor Q (Ganancia de Fusión):</strong> Es la relación entre la energía producida y la energía necesaria para calentar el plasma. Un Q=10 es el objetivo para el despliegue comercial en 2026, permitiendo que el reactor sea auto-sostenible mediante el calentamiento por partículas alfa.</p>
                    </div>

                    <h2>1.2 Cría de Tritio en Mantos de Litio</h2>
                    <p>Dado que el Tritio es extremadamente escaso en la naturaleza, los reactores modernos utilizan mantos de litio que, al ser bombardeados por neutrones de la reacción de fusión, generan nuevo tritio de forma cíclica. Este proceso de "cría" cierra el ciclo de combustible, convirtiendo a la fusión en la fuente de energía más densa conocida por la humanidad.</p>
                `,
                forum: "Consulta sobre Infraestructura Energética"
            },
            'aero_systems': {
                label: "Aeroespacial",
                cat: "Propulsión de Ciclo Combinado",
                title: "Motores Scramjet y Vuelo Hipersónico Atmosférico",
                body: `
                    <p>El vuelo hipersónico (Mach 5+) ha dejado de ser una teoría militar para convertirse en una frontera de transporte global. La clave reside en el motor Scramjet (Supersonic Combusting Ramjet), donde la combustión ocurre en un flujo de aire supersónico, eliminando la necesidad de compresores mecánicos pesados.</p>
                    
                    <h2>2.1 Termodinámica del Flujo Supersónico</h2>
                    <p>En un motor convencional, el aire debe frenarse a velocidades subsónicas para arder. En un Scramjet, el aire entra y sale a velocidades increíbles, lo que reduce el tiempo de residencia del combustible a milisegundos. Esto requiere sistemas de inyección de hidrógeno ultra-rápidos y una geometría variable controlada por IA para evitar el apagado de la llama.</p>
                    
                    <h2>2.2 Gestión de Barreras Térmicas por Ablación</h2>
                    <p>A Mach 7, el roce del aire calienta el borde de ataque de la aeronave a más de 2000°C. La ingeniería de materiales utiliza cerámicas reforzadas con carbono y sistemas de enfriamiento transpirativo, donde un fluido circula por micro-poros en la estructura para evaporarse y llevarse el calor excesivo.</p>
                `,
                forum: "Panel de Ingeniería Aeroespacial"
            },
            'bio_quantum': {
                label: "Bio-Ingeniería",
                cat: "Biología Sintética Cuántica",
                title: "Edición Genética mediante Túnel Cuántico de Protones",
                body: `
                    <p>La intersección entre la física cuántica y la biología molecular ha revelado que la vida utiliza efectos cuánticos para optimizar procesos como la fotosíntesis y la mutación de ADN. La biología sintética ahora busca manipular estos efectos para corregir errores genéticos antes de que ocurran.</p>
                    
                    <h2>3.1 Transferencia de Electrones en Proteínas</h2>
                    <p>Las enzimas no actúan solo por colisión mecánica; utilizan el efecto túnel para mover electrones a través de barreras energéticas que serían infranqueables según la física clásica. Al diseñar proteínas sintéticas, podemos programar estas tasas de transferencia para crear catalizadores industriales mil veces más eficientes que los actuales.</p>
                    
                    <h2>3.2 Bio-sensores de Nanodiamantes</h2>
                    <p>Utilizando vacantes de nitrógeno en cristales de diamante, podemos medir campos magnéticos y temperaturas dentro de una sola célula viva con precisión cuántica. Esto permite mapear el metabolismo celular en tiempo real y detectar patologías años antes de que se manifiesten síntomas físicos.</p>
                `,
                forum: "Consultoría en Biotecnología Avanzada"
            },
            'data_sovereignty': {
                label: "Seguridad Digital",
                cat: "Criptografía Post-Cuántica",
                title: "Protocolos Lattice-Based y Resistencia al Algoritmo de Shor",
                body: `
                    <p>Con la llegada de los procesadores cuánticos de 1000 qubits, el cifrado RSA actual es obsoleto. La soberanía de datos ahora depende de la criptografía basada en retículos (Lattices), problemas matemáticos que son difíciles de resolver incluso para una computadora cuántica.</p>
                    <h2>4.1 Encriptación Homomórfica Total</h2>
                    <p>Este protocolo permite realizar cálculos sobre datos cifrados sin tener que desencriptarlos nunca. Es el "Santo Grial" de la privacidad: un servidor puede procesar tus datos médicos o financieros sin ver jamás la información real, devolviéndote el resultado cifrado que solo tú puedes abrir.</p>
                `,
                forum: "Auditoría de Ciberseguridad Proactiva"
            },
            'deep_earth': {
                label: "Geotecnia",
                cat: "Minería de Ciclo Cerrado",
                title: "Extracción Robótica en Ambientes de Extrema Presión",
                body: `
                    <p>La minería del futuro no ocurre en la superficie, sino en profundidades superiores a los 5km. A estas profundidades, la roca se comporta de forma plástica y las temperaturas superan los 60°C, requiriendo una flota de robots autónomos con sistemas de refrigeración criogénica interna.</p>
                    <h2>5.1 Lixiviación in-situ con Nanobots</h2>
                    <p>En lugar de excavar túneles masivos, inyectamos fluidos cargados con nanobots programados para disolver y capturar metales específicos (como Litio o Cobalto) directamente de la veta mineral, bombeando el concentrado de vuelta a la superficie con un impacto ambiental nulo.</p>
                `,
                forum: "Consultoría en Minería Sustentable"
            }
        };

        function buildNav() {
            const nav = document.getElementById('nav-target');
            let html = '<div class="brand">NEXUS / CORE</div>';
            for (let id in library) {
                html += `
                    <div class="nav-group">
                        <span class="nav-label">${library[id].label}</span>
                        <a href="javascript:void(0)" onclick="load('${id}')" class="nav-item" id="nav-${id}">${library[id].title}</a>
                    </div>`;
            }
            nav.innerHTML = html;
        }

        function load(id) {
            const data = library[id];
            const view = document.getElementById('content-view');
            
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
            document.getElementById('nav-'+id).classList.add('active');

            view.innerHTML = `
                <div class="kicker">${data.cat.toUpperCase()} // PROTOCOLO_2026</div>
                <h1>${data.title}</h1>
                <div class="article-text">${data.body}</div>
                
                <section class="forum-wrap">
                    <h3>${data.forum}</h3>
                    <p>Ingresa al repositorio oficial para compartir datos, solicitar revisiones de diseño o contactar con el departamento de ingeniería.</p>
                    <form class="grid-form">
                        <input type="text" placeholder="Entidad / Nombre" required>
                        <input type="email" placeholder="Dirección de Enlace (Email)" required>
                        <textarea placeholder="Escribe tu consulta técnica detallada, incluyendo variables y objetivos del proyecto..."></textarea>
                        <button type="submit" class="btn-supreme">REGISTRAR CONSULTA EN EL NODO</button>
                    </form>
                </section>
            `;
            document.querySelector('main').scrollTo(0,0);
        }

        buildNav();
        load('fusion_energy');
    </script>
</body>
</html>
