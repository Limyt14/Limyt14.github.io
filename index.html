<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTELLIGENTIA CORE | Engineering & Research 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ffffff; --text: #050505; --accent: #0022ff; --border: #f0f0f0; --sidebar: #f8f9fa; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Lexend', sans-serif; display: flex; height: 100vh; overflow: hidden; line-height: 2.0; letter-spacing: 0.015em; }

        /* --- NAVEGACIÓN --- */
        aside { width: 450px; background: var(--sidebar); border-right: 2px solid var(--border); display: flex; flex-direction: column; padding: 50px 30px; overflow-y: auto; }
        .brand { font-family: 'JetBrains Mono'; font-weight: 800; font-size: 1.4rem; margin-bottom: 40px; border-left: 12px solid #000; padding-left: 20px; }
        .nav-label { font-size: 0.7rem; text-transform: uppercase; color: #a0a0a0; letter-spacing: 3px; margin: 35px 0 10px; font-weight: 700; border-bottom: 1px solid #eee; }
        .nav-item { display: block; padding: 12px 0; color: var(--text); text-decoration: none; font-size: 0.95rem; transition: 0.3s; cursor: pointer; }
        .nav-item:hover { color: var(--accent); transform: translateX(10px); }
        .nav-item.active { font-weight: 800; color: var(--accent); border-right: 4px solid var(--accent); }

        /* --- CONTENIDO --- */
        main { flex: 1; overflow-y: auto; padding: 120px 8%; scroll-behavior: smooth; }
        .article { max-width: 1100px; margin: 0 auto; animation: contentFade 1s ease-out; }
        @keyframes contentFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; } }
        
        h1 { font-size: 4.8rem; font-weight: 800; letter-spacing: -6px; line-height: 0.9; margin-bottom: 4rem; }
        h2 { font-size: 2.2rem; font-weight: 700; margin: 6rem 0 2rem; border-bottom: 5px solid #000; display: inline-block; }
        h3 { font-size: 1.6rem; margin: 3rem 0 1.5rem; color: var(--accent); font-weight: 600; }
        p { font-size: 1.3rem; margin-bottom: 3.5rem; text-align: justify; font-weight: 300; color: #111; }

        .data-box { background: #000; color: #fff; padding: 40px; margin: 5rem 0; font-family: 'JetBrains Mono'; font-size: 0.9rem; border-radius: 2px; line-height: 1.6; }

        /* --- COOKIES --- */
        #cookie-wall { position: fixed; bottom: 40px; left: 40px; width: 450px; background: #000; color: #fff; padding: 40px; z-index: 2000; }
        .c-btn { width: 100%; padding: 20px; background: #fff; color: #000; border: none; font-weight: 800; cursor: pointer; margin-top: 25px; text-transform: uppercase; }

        @media (max-width: 1300px) { body { flex-direction: column; } aside { width: 100%; height: 35vh; } }
    </style>
</head>
<body>

    <aside id="nav-target"></aside>

    <main id="scroll-engine">

                <div class="data-box">> SECURITY_ALERT: Intentos de intrusión mitigados mediante aislamiento de contenedores por hardware.</div>

        function buildMenu() {
            const nav = document.getElementById('nav-target');
            let html = '<div class="brand">INTELLIGENTIA_CORE</div>';
            for (let key in library) {
                html += `<div class="nav-group">
                    <span class="nav-label">${library[key].cat}</span>
                    <a href="javascript:void(0)" onclick="load('${key}')" class="nav-item" id="nav-${key}">${library[key].title}</a>
                </div>`;
            }
            nav.innerHTML = html;
        }

        function load(id) {
            const data = library[id];
            const area = document.getElementById('render-target');
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
            document.getElementById(`nav-${id}`).classList.add('active');

            area.innerHTML = `
                <div style="font-family:'JetBrains Mono'; font-size:0.8rem; color:var(--accent); margin-bottom:2rem; letter-spacing:2px;">
                    :: REPOSITORY_NODE_2026 // ACCESS_GRANTED // REF_${id.toUpperCase()}
                </div>
                <h1>${data.title}</h1>
                <div class="article-content">${data.body}</div>
                <section style="background:#f9f9f9; padding:60px; margin-top:10rem; border-top:10px solid #000;">
                    <h2>FORO DE CONSULTA TÉCNICA</h2>
                    <p>Acceso restringido. Ingrese parámetros para validación por nuestro panel de ingenieros.</p>
                    <form style="display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-top:40px;">
                        <input type="text" placeholder="ID Investigador" style="padding:20px; border:2px solid #ddd; font-family:'Lexend'; font-size:1rem;">
                        <input type="email" placeholder="Email Institucional" style="padding:20px; border:2px solid #ddd; font-family:'Lexend'; font-size:1rem;">
                        <textarea placeholder="Descripción del desafío técnico..." style="grid-column:span 2; padding:20px; border:2px solid #ddd; font-family:'Lexend'; font-size:1rem; height:200px;"></textarea>
                        <button type="submit" style="grid-column:span 2; padding:25px; background:#000; color:#fff; font-weight:800; border:none; cursor:pointer; font-size:1.1rem; letter-spacing:2px;">REGISTRAR EN EL NODO</button>

</html>
